services:
  kitty-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: kitty-api
    command: ["api"]
    ports:
      - "${KITTY_PORT:-8080}:8080"
    environment:
      KITTY_HOST: 0.0.0.0
      KITTY_PORT: "8080"
      KITTY_API_TOKEN: "${KITTY_API_TOKEN:-}"
      OPENCODE_API_KEY: "${OPENCODE_API_KEY:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  kitty-gui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["gui"]
    ports:
      - "8081:8081"
    environment:
      KITTY_GUI_ADDR: "0.0.0.0:8081"
      OPENCODE_API_KEY: "${OPENCODE_API_KEY:-}"
    restart: unless-stopped